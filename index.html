<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #ffb6c1;
            font-family: 'Caveat', cursive, sans-serif;
            overflow: hidden; 
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
            user-select: none; 
            touch-action: manipulation;
        }

        .screen {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            text-align: center;
            z-index: 10;
        }
        
        .active { display: flex; }

        h1 { font-size: 4rem; margin: 10px; padding: 0 20px;}
        h2 { font-size: 3rem; margin: 0; color: #fffacd; }

        .tap-hint {
            font-size: 1.5rem;
            margin-top: 30px;
            opacity: 0;
            transition: opacity 1s;
            cursor: pointer;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .floating-bg {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden; z-index: 1; pointer-events: none;
        }

        .float-item {
            position: absolute;
            bottom: -150px;
            text-shadow: none; 
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
        }

        #reel-image {
            max-width: 85vw;
            max-height: 60vh;
            border: 8px solid white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            object-fit: cover;
            transition: opacity 0.3s;
        }
        
        /* FIXED BACKGROUND SECTION */
        #screen2 {
            background-image: url('bg-image.jpg'); /* Image is now forced here */
            background-size: cover;
            background-position: center;
            background-color: rgba(0, 0, 0, 0.4); /* Darkened slightly so text is readable, no more pink! */
            background-blend-mode: overlay;
        }
    </style>
</head>
<body>

    <div class="floating-bg" id="bg-container"></div>

    <div id="screen1" class="screen active" onclick="nextScreen(1)">
        <h1>What day is today?</h1>
        <div id="hint1" class="tap-hint">Tap anywhere to find out...</div>
    </div>

    <div id="screen2" class="screen" onclick="nextScreen(2)">
        <h1>Happy Birthday !!</h1>
        <!-- Edit the name carefully below -->
        <h2>/name/</h2>
        <div id="hint2" class="tap-hint">Tap to see memories...</div>
    </div>

    <div id="screen3" class="screen" onclick="advanceReel()">
        <img id="reel-image" src="" alt="Memory">
        <div class="tap-hint" style="opacity: 1; margin-top: 15px;">Tap for next...</div>
    </div>

    <div id="screen4" class="screen">
        <h1>Hope you had a great day!</h1>
        <p style="font-size: 1.5rem;">Listen to this message ⬇️</p>
        <audio id="voice-note" controls>
            <source src="voice-note.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <script>
        const reelImages = [
            "image1.jpg", 
            "image2.jpg", 
            "image3.jpg"
        ];
        
        let currentReelIndex = 0;
        const bgContainer = document.getElementById('bg-container');
        let floatInterval;

        function createFloatingItem(itemsArray) {
            const item = document.createElement('div');
            item.classList.add('float-item');
            item.innerText = itemsArray[Math.floor(Math.random() * itemsArray.length)];
            item.style.left = Math.random() * 100 + 'vw';
            item.style.animationDuration = (Math.random() * 3 + 4) + 's';
            item.style.fontSize = (Math.random() * 3 + 3) + 'rem'; 
            bgContainer.appendChild(item);

            setTimeout(() => { item.remove(); }, 7000);
        }

        floatInterval = setInterval(() => createFloatingItem(['❓', '🤔', '❔']), 800);

        setTimeout(() => { document.getElementById('hint1').style.opacity = 1; }, 2500);

        function nextScreen(current) {
            document.getElementById(`screen${current}`).classList.remove('active');
            
            if (current === 1) {
                document.getElementById('screen2').classList.add('active');
                
                clearInterval(floatInterval);
                bgContainer.innerHTML = ''; 
                floatInterval = setInterval(() => createFloatingItem(['🎈', '✨', '🎉', '🎈']), 500);

                setTimeout(() => { document.getElementById('hint2').style.opacity = 1; }, 3000);
            } 
            else if (current === 2) {
                document.getElementById('screen3').classList.add('active');
                clearInterval(floatInterval);
                bgContainer.innerHTML = ''; 
                
                document.getElementById('reel-image').src = reelImages[currentReelIndex];
            }
        }

        function advanceReel() {
            currentReelIndex++;
            if (currentReelIndex < reelImages.length) {
                document.getElementById('reel-image').src = reelImages[currentReelIndex];
            } else {
                document.getElementById('screen3').classList.remove('active');
                document.getElementById('screen4').classList.add('active');
                document.getElementById('voice-note').play();
            }
        }
    </script>
</body>
</html>
